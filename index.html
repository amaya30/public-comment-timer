<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
try {
  var t = localStorage.getItem("publicCommentTimer.theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<title>Public Comment Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.a%7Bfill:%23237698%7D.b%7Bfill:%23fff%7D@media (prefers-color-scheme:dark)%7B.a%7Bfill:%235fb4d6%7D.b%7Bfill:%230a1d27%7D%7D%3C/style%3E%3Ccircle class='a' cx='16' cy='16' r='15'/%3E%3Cpath class='b' d='M16 16V6a10 10 0 0 1 10 10z'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#237698">
<style>
/* Fonts are self-hosted so the page works offline. */
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/Barlow-400.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/Barlow-500.ttf") format("truetype"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/Barlow-600.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/BarlowCondensed-500.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/BarlowCondensed-600.ttf") format("truetype"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/BarlowCondensed-700.ttf") format("truetype"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/IBMPlexMono-500.ttf") format("truetype"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/IBMPlexMono-600.ttf") format("truetype"); }
/* Layout: one centered stage. Status line, giant countdown, progress bar, two big buttons, small settings strip below. */
:root {
  --bg: #f5f5f5;
  --panel: #ffffff;
  --fg: #1c1c1c;
  --muted: #4f5b62;
  --line: #d6d6d6;
  --accent: #237698;
  --on-accent: #ffffff;
  --brand-dark: #0e4e68;
  --go: #237698;
  --warn: #a85f00;
  --stop: #d01f26;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --font-digits: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1d27;
    --panel: #102b38;
    --fg: #ecf1f3;
    --muted: #9db3be;
    --line: #22485a;
    --accent: #5fb4d6;
    --on-accent: #08202b;
    --brand-dark: #5fb4d6;
    --go: #5fb4d6;
    --warn: #e0a849;
    --stop: #ff7478;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1d27;
  --panel: #102b38;
  --fg: #ecf1f3;
  --muted: #9db3be;
  --line: #22485a;
  --accent: #5fb4d6;
  --on-accent: #08202b;
  --brand-dark: #5fb4d6;
  --go: #5fb4d6;
  --warn: #e0a849;
  --stop: #ff7478;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
main {
  width: 100%;
  max-width: 1200px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  justify-content: center;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brand-dark);
  margin: 0;
}
.status {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.5rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 16px;
  border: 2px solid currentColor;
  border-radius: 4px;
  color: var(--muted);
}
.status[data-state="running"] { color: var(--go); }
.status[data-state="warn"] { color: var(--warn); }
.status[data-state="done"] { color: var(--stop); }

.clock {
  margin: 0;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: clamp(4rem, 38vw, 34rem);
  line-height: 1;
  letter-spacing: 0;
  white-space: nowrap;
  color: var(--fg);
}
.clock[data-state="warn"] { color: var(--warn); }
.clock[data-state="done"] { color: var(--stop); }

.bar {
  height: 14px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--go);
  transform-origin: left center;
}
.bar[data-state="warn"] > i { background: var(--warn); }
.bar[data-state="done"] > i { background: var(--stop); }

.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
button {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 18px 12px;
  border-radius: 6px;
  border: 2px solid var(--accent);
  cursor: pointer;
  min-height: 72px;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid var(--fg);
  outline-offset: 3px;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: transparent; color: var(--accent); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.settings {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 16px 28px;
}
.settings h2 {
  margin: 0;
  width: 100%;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 0.9rem; color: var(--muted); }
.field input {
  width: 96px;
  font-family: var(--font-digits);
  font-size: 1.4rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 8px 10px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.presets button, .theme-btn, .sound-btn {
  font-size: 1.1rem;
  min-height: 0;
  padding: 10px 16px;
  letter-spacing: 0.08em;
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line);
}
.hint { margin: 0; width: 100%; font-size: 0.9rem; color: var(--muted); }
kbd {
  font-family: var(--font-digits);
  font-size: 0.85rem;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--bg);
  color: var(--fg);
}

@media (max-width: 520px) {
  .controls { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<main>
  <div class="status-row">
    <h1 class="title">Public Comment</h1>
    <div class="status" id="status" data-state="idle" role="status" aria-live="polite">Ready</div>
  </div>

  <p class="clock" id="clock" data-state="idle" aria-label="Time remaining">
    <span id="mm">02</span>:<span id="ss">00</span>
  </p>

  <div class="bar" id="bar" data-state="idle" aria-hidden="true"><i id="fill"></i></div>

  <div class="controls">
    <button type="button" class="btn-primary" id="startBtn">Start</button>
    <button type="button" class="btn-secondary" id="resetBtn">Reset</button>
  </div>

  <section class="settings" aria-label="Timer settings">
    <h2>Time limit</h2>
    <div class="field">
      <label for="minInput">Minutes</label>
      <input id="minInput" type="number" min="0" max="59" step="1" value="2" inputmode="numeric">
    </div>
    <div class="field">
      <label for="secInput">Seconds</label>
      <input id="secInput" type="number" min="0" max="59" step="1" value="0" inputmode="numeric">
    </div>
    <div class="presets" role="group" aria-label="Quick limits">
      <button type="button" data-preset="60">1:00</button>
      <button type="button" data-preset="120">2:00</button>
      <button type="button" data-preset="180">3:00</button>
    </div>
    <div class="field">
      <label for="soundBtn">Sound at zero</label>
      <button type="button" class="sound-btn" id="soundBtn" aria-pressed="false"></button>
    </div>
    <div class="field">
      <label for="themeBtn">Theme</label>
      <button type="button" class="theme-btn" id="themeBtn"></button>
    </div>
    <p class="hint">Limit can only be changed after the timer is reset. Shortcuts: <kbd>Space</kbd> start or pause, <kbd>R</kbd> reset. The clock turns amber at 30 seconds and red at zero.</p>
  </section>
</main>

<script>
(function () {
  var WARN_MS = 30000;
  var DEFAULT_SECONDS = 120;
  var STORE_KEY = "publicCommentTimer.limitSeconds";

  var el = {
    mm: document.getElementById("mm"),
    ss: document.getElementById("ss"),
    clock: document.getElementById("clock"),
    bar: document.getElementById("bar"),
    fill: document.getElementById("fill"),
    status: document.getElementById("status"),
    start: document.getElementById("startBtn"),
    reset: document.getElementById("resetBtn"),
    minIn: document.getElementById("minInput"),
    secIn: document.getElementById("secInput"),
    presets: document.querySelectorAll("[data-preset]"),
    theme: document.getElementById("themeBtn"),
    sound: document.getElementById("soundBtn")
  };

  var maxMs = DEFAULT_SECONDS * 1000;
  var remaining = maxMs;
  var running = false;
  var endAt = 0;
  var raf = 0;
  var wakeLock = null;
  var SOUND_KEY = "publicCommentTimer.sound";
  var soundOn = false;
  var audioCtx = null;

  try { soundOn = localStorage.getItem(SOUND_KEY) === "1"; } catch (e) {}
  try {
    var saved = parseInt(localStorage.getItem(STORE_KEY), 10);
    if (saved > 0 && saved <= 3599) { maxMs = saved * 1000; remaining = maxMs; }
  } catch (e) {}

  function pad(n, w) { n = String(n); while (n.length < w) n = "0" + n; return n; }

  function stateFor(ms) {
    if (ms <= 0) return "done";
    if (ms <= WARN_MS && (running || ms < maxMs)) return "warn";
    return running ? "running" : "idle";
  }

  function render() {
    var ms = Math.max(0, Math.ceil(remaining));
    var secs = Math.ceil(ms / 1000);
    el.mm.textContent = pad(Math.floor(secs / 60), 2);
    el.ss.textContent = pad(secs % 60, 2);

    var st = stateFor(ms);
    var barSt = st;
    el.clock.dataset.state = st === "running" || st === "idle" ? "idle" : st;
    el.bar.dataset.state = st === "warn" || st === "done" ? st : "idle";
    el.fill.style.transform = "scaleX(" + (maxMs > 0 ? ms / maxMs : 0) + ")";

    var label = "Ready";
    if (ms <= 0) label = "Time";
    else if (running) label = ms <= WARN_MS ? "Wrap up" : "Speaking";
    else if (ms < maxMs) label = "Paused";
    el.status.textContent = label;
    el.status.dataset.state = barSt === "idle" ? "idle" : barSt;

    el.start.textContent = running ? "Pause" : (ms < maxMs && ms > 0 ? "Resume" : "Start");
    el.start.disabled = ms <= 0;

    var lock = running || ms < maxMs;
    el.minIn.disabled = lock;
    el.secIn.disabled = lock;
    for (var i = 0; i < el.presets.length; i++) el.presets[i].disabled = lock;
  }

  function tick() {
    if (!running) return;
    remaining = endAt - performance.now();
    if (remaining <= 0) {
      remaining = 0;
      running = false;
      releaseWake();
      render();
      if (soundOn) chime();
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  // Browsers only allow audio after a user gesture, so the context is created
  // (or resumed) when the sound is switched on and when the timer is started.
  function getAudio() {
    if (!audioCtx) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (Ctor) { try { audioCtx = new Ctor(); } catch (e) {} }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function chime() {
    var c = getAudio();
    if (!c) return;
    var t0 = c.currentTime + 0.02;
    for (var n = 0; n < 3; n++) {
      var o = c.createOscillator(), g = c.createGain(), at = t0 + n * 0.4;
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(0.4, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.3);
      o.connect(g);
      g.connect(c.destination);
      o.start(at);
      o.stop(at + 0.32);
    }
  }

  function requestWake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }, function () {});
      }
    } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function start() {
    if (running || remaining <= 0) return;
    endAt = performance.now() + remaining;
    running = true;
    if (soundOn) getAudio();
    requestWake();
    render();
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    if (!running) return;
    remaining = Math.max(0, endAt - performance.now());
    running = false;
    cancelAnimationFrame(raf);
    releaseWake();
    render();
  }
  function reset() {
    running = false;
    cancelAnimationFrame(raf);
    releaseWake();
    remaining = maxMs;
    render();
  }
  function toggle() { running ? pause() : start(); }

  function syncInputs() {
    var total = Math.round(maxMs / 1000);
    el.minIn.value = Math.floor(total / 60);
    el.secIn.value = total % 60;
  }
  function applyLimit(seconds) {
    if (running || remaining < maxMs) return;
    seconds =Math.max(1, Math.min(3599, Math.round(seconds)));
    maxMs = seconds * 1000;
    try { localStorage.setItem(STORE_KEY, String(seconds)); } catch (e) {}
    syncInputs();
    reset();
  }
  function readInputs() {
    var m = parseInt(el.minIn.value, 10) || 0;
    var s = parseInt(el.secIn.value, 10) || 0;
    applyLimit(m * 60 + s);
  }

  el.start.addEventListener("click", toggle);
  el.reset.addEventListener("click", reset);
  el.minIn.addEventListener("change", readInputs);
  el.secIn.addEventListener("change", readInputs);
  for (var i = 0; i < el.presets.length; i++) {
    el.presets[i].addEventListener("click", function (ev) {
      applyLimit(parseInt(ev.currentTarget.dataset.preset, 10));
    });
  }

  document.addEventListener("keydown", function (ev) {
    var t = ev.target && ev.target.tagName;
    if (t === "INPUT" || t === "BUTTON" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.code === "Space") { ev.preventDefault(); toggle(); }
    else if (ev.key === "r" || ev.key === "R") { reset(); }
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && running) requestWake();
  });

  function renderSound() {
    el.sound.textContent = soundOn ? "Sound on" : "Sound off";
    el.sound.setAttribute("aria-pressed", soundOn ? "true" : "false");
  }
  el.sound.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
    renderSound();
    if (soundOn) chime();
  });

  var THEME_KEY = "publicCommentTimer.theme";
  var darkQuery = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  function currentTheme() {
    var t = document.documentElement.dataset.theme;
    if (t === "light" || t === "dark") return t;
    return darkQuery && darkQuery.matches ? "dark" : "light";
  }
  function renderTheme() {
    el.theme.textContent = currentTheme() === "dark" ? "Switch to light" : "Switch to dark";
  }
  el.theme.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    renderTheme();
  });
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", renderTheme);

  syncInputs();
  render();
  renderTheme();
  renderSound();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
